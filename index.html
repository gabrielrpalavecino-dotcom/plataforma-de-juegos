<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal de Juegos Definitivo - Red y Cartas</title>
    <!-- SDK de EmailJS para correos y recuperación -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- PeerJS para conexiones P2P en red (WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init("0-1p1Nlyfg1r3I2lN");
        })();
    </script>
    <style>
        :root {
            --bg-color: #071018;
            --panel-bg: #0f1c2e;
            --text-color: #f8fafc;
            --border-color: #1e3a5f;
            --accent-color: #38bdf8;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            max-width: 440px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            margin-top: 10px;
        }

        .card h2 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .setup-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .setup-group label {
            display: block;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .input-field {
            background: #112238;
            color: white;
            border: 2px solid var(--border-color);
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-color);
        }

        .tab-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: #112238;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            color: #94a3b8;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #0284c7;
            color: white;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .btn-select {
            background: #112238;
            color: white;
            border: 2px solid var(--border-color);
            padding: 9px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 6px;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .btn-select.selected {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            margin-bottom: 8px;
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .btn-secondary {
            background-color: #1e293b;
            border: 1px solid var(--border-color);
        }

        .btn-green {
            background-color: var(--accent-green);
        }

        .status-bar {
            background: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            max-width: 440px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* JUEGOS Y TABLEROS */
        .tictactoe-grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 6px;
            margin: 0 auto 10px auto;
            background-color: var(--border-color);
            padding: 6px;
            border-radius: 10px;
        }

        .ttt-cell {
            background-color: var(--panel-bg);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .grid-8 {
            display: grid;
            grid-template-columns: repeat(8, 44px);
            grid-template-rows: repeat(8, 44px);
            gap: 1px;
            background-color: var(--border-color);
            padding: 3px;
            border-radius: 6px;
            margin: 0 auto 10px auto;
        }

        .cell-chk {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .chk-light {
            background-color: #cbd5e1;
        }

        .chk-dark {
            background-color: #1e293b;
        }

        .chk-piece {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .piece-red {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border: 2px solid #fca5a5;
        }

        .piece-black {
            background: linear-gradient(135deg, #475569, #0f172a);
            color: white;
            border: 2px solid #94a3b8;
        }

        .piece-selected {
            box-shadow: 0 0 10px 3px #38bdf8 !important;
        }

        .chess-grid {
            display: grid;
            grid-template-columns: repeat(8, 44px);
            grid-template-rows: repeat(8, 44px);
            border: 3px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            margin: 0 auto 10px auto;
            background-color: var(--border-color);
        }

        .chess-cell {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            position: relative;
        }

        .chess-light {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .chess-dark {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .chess-selected {
            background-color: #38bdf8 !important;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .grid-10 {
            display: grid;
            grid-template-columns: repeat(10, 32px);
            grid-template-rows: repeat(10, 32px);
            gap: 2px;
            background-color: var(--border-color);
            padding: 4px;
            border-radius: 8px;
            margin: 0 auto 10px auto;
        }

        .cell-10 {
            width: 32px;
            height: 32px;
            background-color: #04070f;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: 14px;
        }

        .cell-10.ship {
            background: #475569;
            border: 1px solid #94a3b8;
        }

        .cell-10.hit {
            background-color: #ef4444 !important;
            color: white;
            font-weight: bold;
        }

        .cell-10.miss {
            background-color: #334155 !important;
            color: #94a3b8;
        }

        /* CARTAS Y MESAS */
        .card-table {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 28, 46, 0.9);
            border-radius: 12px;
            border: 2px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-height: 340px;
            justify-content: space-between;
        }

        .opponent-hand-area {
            display: flex;
            gap: 6px;
            min-height: 75px;
            align-items: center;
        }

        .center-board-area {
            display: flex;
            gap: 20px;
            min-height: 105px;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            width: 100%;
            border-radius: 8px;
            padding: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .playing-card,
        .uno-card {
            width: 70px;
            height: 100px;
            background: #f8fafc;
            color: #0f172a;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s;
            flex-shrink: 0;
        }

        .playing-card:hover,
        .uno-card:hover {
            transform: translateY(-4px);
        }

        .playing-card.hidden-card,
        .uno-card.hidden-card {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #64748b;
            color: #94a3b8;
            cursor: default;
        }

        .card-gold {
            color: #b45309;
        }

        .card-cup {
            color: #dc2626;
        }

        .card-sword {
            color: #2563eb;
        }

        .card-club {
            color: #16a34a;
        }

        .uno-card.card-red {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border: 2px solid #fca5a5;
            color: white;
        }

        .uno-card.card-blue {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border: 2px solid #93c5fd;
            color: white;
        }

        .uno-card.card-green {
            background: linear-gradient(135deg, #10b981, #065f46);
            border: 2px solid #6ee7b7;
            color: white;
        }

        .uno-card.card-yellow {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            border: 2px solid #fde68a;
            color: #111;
        }

        .player-hand {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 440px;
            width: 100%;
            padding: 8px;
            background: var(--panel-bg);
            border-radius: 10px;
            border: 2px solid var(--border-color);
            min-height: 110px;
            align-items: center;
            justify-content: center;
        }

        .log-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
            max-width: 440px;
            max-height: 65px;
            overflow-y: auto;
            font-size: 0.75rem;
        }

        .log-entry {
            margin-bottom: 2px;
            color: #cbd5e1;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            max-width: 420px;
            width: 90%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            color: var(--accent-color);
            margin-bottom: 12px;
            text-align: center;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <h1>Portal Táctico Supremo</h1>

    <!-- PANTALLA DE ACCESO Y RECUPERACIÓN -->
    <div class="card" id="login-screen">
        <h2>Acceso al Portal</h2>
        <div class="tab-container">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Ingresar</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrarse</button>
            <button class="tab-btn" id="tab-recover" onclick="switchTab('recover')">Recuperar Clave</button>
        </div>

        <div id="form-login">
            <div class="setup-group">
                <label>Usuario o Correo:</label>
                <input type="text" id="access-user" class="input-field" placeholder="gabrielrpalavecino@gmail.com">
            </div>
            <div class="setup-group">
                <label>Contraseña:</label>
                <input type="password" id="access-admin" class="input-field" placeholder="plataforma#1">
            </div>
            <button class="btn" onclick="handleLogin()">Entrar al Portal</button>
        </div>

        <div id="form-register" style="display: none;">
            <div class="setup-group">
                <label>Nuevo Usuario:</label>
                <input type="text" id="reg-user" class="input-field" placeholder="Nombre de usuario">
            </div>
            <div class="setup-group">
                <label>Correo Electrónico (Mail):</label>
                <input type="email" id="reg-email" class="input-field" placeholder="tu_correo@dominio.com">
            </div>
            <div class="setup-group">
                <label>Contraseña:</label>
                <input type="password" id="reg-admin" class="input-field" placeholder="Crea tu contraseña">
            </div>
            <button class="btn btn-green" onclick="requestVerification()">Enviar Código de Verificación</button>
        </div>

        <div id="form-recover" style="display: none;">
            <div class="setup-group">
                <label>Ingresa tu Correo Registrado:</label>
                <input type="email" id="rec-email" class="input-field" placeholder="gabrielrpalavecino@gmail.com">
            </div>
            <button class="btn" style="background-color: #b45309;" onclick="sendRecoveryEmail()">Recuperar Credenciales
                por Mail</button>
        </div>
    </div>

    <!-- MODAL DE VERIFICACIÓN -->
    <div class="modal" id="verification-modal">
        <div class="modal-content" style="text-align: center;">
            <h3 style="color: var(--accent-green);">Verificación de Correo</h3>
            <p id="verification-msg" style="text-align: center; margin-bottom: 15px;"></p>
            <div class="setup-group">
                <label style="text-align: center;">Código de 4 dígitos:</label>
                <input type="text" id="verification-code-input" class="input-field"
                    style="text-align: center; font-size: 1.4rem; letter-spacing: 5px;" maxlength="4"
                    placeholder="0000">
            </div>
            <button class="btn" onclick="confirmVerificationCode()">Verificar y Entrar</button>
        </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div class="card" id="menu-screen" style="display:none;">
        <h2 id="welcome-title">Selecciona un Juego</h2>

        <!-- PANEL DE SALAS ONLINE (RED P2P) -->
        <div
            style="background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--accent-color); padding: 10px; border-radius: 8px; margin-bottom: 12px;">
            <label
                style="color: var(--accent-color); font-size: 0.75rem; font-weight: bold; display: block; margin-bottom: 4px;">SALAS
                MULTIJUGADOR ONLINE (RED)</label>
            <div style="display: flex; gap: 6px;">
                <button class="btn btn-green" style="margin-bottom:0; font-size:0.75rem; padding:8px;"
                    onclick="createOnlineRoom()">Crear Sala</button>
                <button class="btn btn-secondary" style="margin-bottom:0; font-size:0.75rem; padding:8px;"
                    onclick="joinOnlineRoomPrompt()">Unirse a Sala</button>
            </div>
            <div id="room-info" style="font-size: 0.7rem; color: #94a3b8; margin-top: 6px; word-break: break-all;">
                Estado: Desconectado</div>
        </div>

        <button class="btn" onclick="openGame('ttt')">Tres en Línea</button>
        <button class="btn btn-secondary" onclick="openGame('rps')">Piedra, Papel o Tijera</button>
        <button class="btn btn-green" onclick="openGame('ludo')">Ludo Táctico</button>
        <button class="btn btn-secondary" onclick="openGame('uno')">UNO Táctico Interactivo</button>
        <button class="btn btn-green" onclick="openGame('domino')">Dominó Táctico Interactivo</button>
        <button class="btn btn-secondary" onclick="openGame('bs')" style="background-color: #0284c7;">Batalla
            Naval</button>
        <button class="btn" style="background-color: #7c3aed;" onclick="openGame('chk')">Damas Clásicas</button>
        <button class="btn" style="background-color: #b45309;" onclick="openGame('truco')">El Truco Argentino
            Interactivo</button>
        <button class="btn btn-secondary" onclick="openGame('tute')">Tute Cabreo Interactivo</button>
        <button class="btn btn-green" onclick="openGame('chess')">Ajedrez Clásico</button>
        <button class="btn" style="background-color: #059669;" onclick="openGame('generala')">Generala Táctica</button>
        <button class="btn btn-secondary" style="background-color: #991b1b; margin-top: 15px;" onclick="logout()">Cerrar
            Sesión</button>
    </div>

    <!-- CONFIGURACIÓN DE BATALLA NAVAL -->
    <div class="card" id="setup-screen" style="display:none;">
        <h2 id="setup-title">Configurar Batalla Naval</h2>
        <div class="setup-group">
            <label>Cantidad de Barcos:</label>
            <button class="btn-select selected" id="fleet-7" onclick="setFleetSize(7)">7 Barcos (Corto)</button>
            <button class="btn-select" id="fleet-9" onclick="setFleetSize(9)">9 Barcos (Medio)</button>
            <button class="btn-select" id="fleet-11" onclick="setFleetSize(11)">11 Barcos (Extenso)</button>
        </div>
        <button class="btn" onclick="launchGame()">¡Comenzar Partida!</button>
        <button class="btn btn-secondary" onclick="returnToMenu()">Volver al Menú</button>
    </div>

    <!-- INTERFAZ DE JUEGO -->
    <div id="game-container" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <div class="status-bar" id="game-status">Estado</div>
        <div id="game-board-area" style="display:flex; flex-direction:column; align-items:center; width:100%;"></div>
        <button class="btn btn-secondary" style="max-width: 440px; margin-top: 10px;" onclick="returnToMenu()">Volver al
            Menú</button>
        <div class="log-container" id="game-log" style="margin-top: 10px;">
            <div class="log-entry">Partida activa.</div>
        </div>
    </div>

    <script>
        const encrypt = (str) => btoa(encodeURIComponent(str));
        const decrypt = (str) => decodeURIComponent(atob(str));

        function initAdminAccount() {
            let users = JSON.parse(localStorage.getItem('portal_users')) || [];
            if (!users.some(u => u.email === 'gabrielrpalavecino@gmail.com')) {
                users.push({
                    user: 'admin',
                    email: 'gabrielrpalavecino@gmail.com',
                    pass: encrypt('plataforma#1')
                });
                localStorage.setItem('portal_users', JSON.stringify(users));
            }
        }
        initAdminAccount();

        let currentGame = '';
        let currentUser = '';
        let generatedRandomCode = '';
        let registeredUserEmail = '';
        let registeredUserName = '';
        let selectedFleetSize = 7;

        // RED P2P PEERJS
        let peer = null;
        let conn = null;
        let isHost = false;

        function initPeerConnection() {
            if (peer) peer.destroy();
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('room-info').innerText = `Tu ID de Sala: ${id}`;
                logMsg(`Sala creada. Código: ${id}`);
                alert(`¡Sala creada con éxito!\n\nTu código de sala es: ${id}\nCompártelo con tu amigo para conectarse.`);
            });
            peer.on('connection', (connection) => {
                conn = connection;
                isHost = true;
                setupConnectionEvents();
                alert("¡Un jugador se ha conectado a tu sala!");
            });
        }

        function createOnlineRoom() { initPeerConnection(); }

        function joinOnlineRoomPrompt() {
            let targetId = prompt("Ingresa el código de la sala de tu amigo:");
            if (!targetId) return;
            if (!peer) {
                peer = new Peer();
                peer.on('open', () => connectToRoom(targetId.trim()));
            } else {
                connectToRoom(targetId.trim());
            }
        }

        function connectToRoom(targetId) {
            conn = peer.connect(targetId);
            isHost = false;
            setupConnectionEvents();
            conn.on('open', () => {
                alert("¡Conexión establecida con éxito!");
                document.getElementById('room-info').innerText = `Conectado a sala externa`;
            });
        }

        function setupConnectionEvents() {
            conn.on('data', (data) => {
                if (data.type === 'move') handleRemoteMove(data);
            });
        }

        function sendNetworkMove(data) {
            if (conn && conn.open) conn.send(data);
        }

        const FLEET_PRESETS = {
            7: [4, 3, 3, 2, 2, 2, 1],
            9: [5, 4, 3, 3, 2, 2, 2, 1, 1],
            11: [5, 4, 4, 3, 3, 2, 2, 2, 1, 1, 1]
        };

        function switchTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('tab-recover').classList.toggle('active', tab === 'recover');
            document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('form-recover').style.display = tab === 'recover' ? 'block' : 'none';
        }

        function handleLogin() {
            const inputId = document.getElementById('access-user').value.trim();
            const inputPass = document.getElementById('access-admin').value.trim();

            if (!inputId || !inputPass) {
                alert("Por favor completa los campos de acceso.");
                return;
            }

            let users = JSON.parse(localStorage.getItem('portal_users')) || [];
            let found = users.find(u => (u.user === inputId || u.email === inputId) && decrypt(u.pass) === inputPass);

        function renderTTT() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Tres en Línea | Turno de ${tttTurn}`;
            area.innerHTML = `<div class="tictactoe-grid" id="ttt-grid"></div>`;
            const grid = document.getElementById('ttt-grid');
            tttBoard.forEach((val, idx) => {
                const cell = document.createElement('div');
                cell.className = 'ttt-cell';
                cell.style.color = val === 'X' ? '#38bdf8' : '#f43f5e';
                cell.innerText = val;
                cell.onclick = () => {
                    if (!tttActive || tttBoard[idx] !== '' || tttTurn !== 'X') return;
                    tttBoard[idx] = 'X'; renderTTT();
                    sendNetworkMove({ type: 'move', game: 'ttt', idx: idx, val: 'X' });
                    if (checkTTTWin('X')) { document.getElementById('game-status').innerText = "¡Ganaste!"; tttActive = false; return; }
                    if (tttBoard.every(c => c !== '')) { document.getElementById('game-status').innerText = "¡Empate!"; tttActive = false; return; }
                    tttTurn = 'O'; document.getElementById('game-status').innerText = "🤖 Turno rival...";
                    if (!conn) setTimeout(botTTTMove, 700);
                };
                grid.appendChild(cell);
            });
        }
        function botTTTMove() {
            if (!tttActive) return;
            let empty = tttBoard.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (empty.length === 0) return;
            let move = empty[Math.floor(Math.random() * empty.length)];
            tttBoard[move] = 'O'; renderTTT();
            if (checkTTTWin('O')) { document.getElementById('game-status').innerText = "¡Ganó el Bot!"; tttActive = false; return; }
            tttTurn = 'X'; document.getElementById('game-status').innerText = "Tu turno (X)";
        }
        function checkTTTWin(p) {
            const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
            return wins.some(c => c.every(i => tttBoard[i] === p));
        }
        function handleRemoteMove(data) {
            if (data.game === 'ttt') {
                tttBoard[data.idx] = data.val;

        // --- 6. BATALLA NAVAL ---
        let bsBoard = [], bsShots = [];
        function initBattleship() {
            bsBoard = Array(10).fill(0).map(() => Array(10).fill(0));
            bsShots = Array(10).fill(0).map(() => Array(10).fill(0));
            autoPlaceBSFleet();
            renderBS();

        function autoPlaceBSFleet() {
            let config = FLEET_PRESETS[selectedFleetSize];
            for (let len of config) {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 500) {
                    attempts++;
                    let h = Math.random() < 0.5;
                    let r = Math.floor(Math.random() * (h ? 10 : 10 - len + 1));
                    let c = Math.floor(Math.random() * (h ? 10 - len + 1 : 10));
                    let ok = true;
                    for (let i = 0; i < len; i++) if (bsBoard[h ? r : r + i][h ? c + i : c] === 1) ok = false;
                    if (ok) {
                        for (let i = 0; i < len; i++) bsBoard[h ? r : r + i][h ? c + i : c] = 1;
                        placed = true;
                    }
                }
            }
        }
        function renderBS() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Batalla Naval (${selectedFleetSize} Barcos)`;
            area.innerHTML = `<div class="grid-10" id="bs-grid"></div>`;

                    cell.onclick = () => {

                    };

        // --- 7. DAMAS CLÁSICAS (Reparadas y funcionales) ---
        let chkBoard = [], selectedChk = null, chkTurn = 'red';
        function initCheckers() {
            chkBoard = Array(8).fill(0).map(() => Array(8).fill(null));
            for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) chkBoard[r][c] = 'black';
            for (let r = 5; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) chkBoard[r][c] = 'red';
            selectedChk = null; chkTurn = 'red'; renderCheckers();
        }
        function renderCheckers() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Damas | Turno de ${chkTurn === 'red' ? 'Rojas' : 'Negras'}`;
            area.innerHTML = `<div class="grid-8" id="chk-grid"></div>`;
            const grid = document.getElementById('chk-grid');
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell-chk ${(r + c) % 2 === 1 ? 'chk-dark' : 'chk-light'}`;
                    let piece = chkBoard[r][c];
                    if (piece) {
                        const pEl = document.createElement('div');
                        pEl.className = `chk-piece ${piece === 'red' ? 'piece-red' : 'piece-black'}`;
                        if (selectedChk && selectedChk.r === r && selectedChk.c === c) pEl.classList.add('piece-selected');
                        cell.appendChild(pEl);
                    }
                    cell.onclick = () => {
                        if (piece === chkTurn) {
                            selectedChk = { r, c };
                            renderCheckers();
                        } else if (selectedChk && piece === null) {
                            let dr = r - selectedChk.r;
                            let dc = Math.abs(c - selectedChk.c);
                            let validDir = (chkTurn === 'red' && dr === -1) || (chkTurn === 'black' && dr === 1);

                            // Movimiento simple diagonal
                            if (validDir && dc === 1 && Math.abs(dr) === 1) {
                                chkBoard[r][c] = chkTurn;
                                chkBoard[selectedChk.r][selectedChk.c] = null;
                                selectedChk = null;
                                chkTurn = chkTurn === 'red' ? 'black' : 'red';
                                renderCheckers();
                            }
                            // Salto de captura
                            else if (Math.abs(dr) === 2 && Math.abs(dc) === 2) {
                                let midR = selectedChk.r + dr / 2;
                                let midC = selectedChk.c + dc / 2;
                                let jumpedPiece = chkBoard[midR][midC];
                                if (jumpedPiece && jumpedPiece !== chkTurn) {
                                    chkBoard[r][c] = chkTurn;
                                    chkBoard[selectedChk.r][selectedChk.c] = null;
                                    chkBoard[midR][midC] = null;
                                    selectedChk = null;
                                    chkTurn = chkTurn === 'red' ? 'black' : 'red';
                                    renderCheckers();
                                }
                            }
                        }
                    };
                    grid.appendChild(cell);
                }
            }
        }

        // --- 8. EL TRUCO ARGENTINO ---
        let trucoManoHumano = [], trucoManoBot = [];
        const ICONOS_PALOS = { oro: '🪙', copa: '🍷', espada: '⚔️', basto: '🪵' };
        function obtenerPuntajeTruco(carta) {
            if (carta.num === 1 && carta.palo === 'espada') return 14;
            if (carta.num === 1 && carta.palo === 'basto') return 13;
            if (carta.num === 7 && carta.palo === 'espada') return 12;
            if (carta.num === 7 && carta.palo === 'oro') return 11;
            if (carta.num === 3) return 10;
            if (carta.num === 2) return 9;
            if (carta.num === 1 && (carta.palo === 'copa' || carta.palo === 'oro')) return 8;
            if (carta.num === 12) return 7;
            if (carta.num === 11) return 6;
            if (carta.num === 10) return 5;
            if (carta.num === 7) return 4;
            if (carta.num === 6) return 3;
            if (carta.num === 5) return 2;
            if (carta.num === 4) return 1;
            return 0;
        }
        function initTruco() {
            let mazo = [];
            ['oro', 'copa', 'espada', 'basto'].forEach(palo => {
                [1, 2, 3, 4, 5, 6, 7, 10, 11, 12].forEach(num => mazo.push({ num, palo }));
            });
            mazo.sort(() => Math.random() - 0.5);
            trucoManoHumano = [mazo.pop(), mazo.pop(), mazo.pop()];
            trucoManoBot = [mazo.pop(), mazo.pop(), mazo.pop()];
            renderTruco();
        }
        function renderTruco() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = "El Truco Argentino - Jerarquía Oficial";
            area.innerHTML = `
                <div class="card-table">
                    <div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:4px; text-align:center;">Cartas del Bot:</div>
                        <div class="opponent-hand-area" id="truco-bot-hand"></div>
                    </div>
                    <div class="center-board-area" id="truco-center">
                        <div style="color:#94a3b8; font-style:italic;">Tira una carta al centro</div>
                    </div>
                    <div>
                        <div style="font-size:0.8rem; color:var(--accent-color); margin-bottom:4px; text-align:center;">Tus Cartas:</div>
                        <div class="player-hand" id="truco-player-hand"></div>
                    </div>
                </div>
            `;
            const botDiv = document.getElementById('truco-bot-hand');
            trucoManoBot.forEach(() => {
                const el = document.createElement('div');
                el.className = 'playing-card hidden-card';
                el.innerHTML = `<span style="font-size:0.8rem; align-self:center;">TRUCO</span>`;
                botDiv.appendChild(el);
            });
            const handDiv = document.getElementById('truco-player-hand');
            trucoManoHumano.forEach((c, i) => {
                const el = document.createElement('div');
                el.className = `playing-card card-${c.palo === 'oro' ? 'gold' : c.palo === 'copa' ? 'cup' : c.palo === 'espada' ? 'sword' : 'club'}`;
                el.innerHTML = `<span>${c.num}</span><span style="font-size:1.4rem; align-self:center;">${ICONOS_PALOS[c.palo]}</span><span>${c.num}</span>`;
                el.onclick = () => playTrucoCard(i);
                handDiv.appendChild(el);
            });
        }
        function playTrucoCard(i) {
            let cartaH = trucoManoHumano.splice(i, 1)[0];
            let cartaB = trucoManoBot.splice(Math.floor(Math.random() * trucoManoBot.length), 1)[0];
            let valH = obtenerPuntajeTruco(cartaH);
            let valB = obtenerPuntajeTruco(cartaB);
            let ganador = valH > valB ? "¡Ganaste la mano!" : valH < valB ? "El Bot ganó la mano" : "Empate (Parda)";

            const centerDiv = document.getElementById('truco-center');
            const paloH = cartaH.palo === 'oro' ? 'card-gold' : cartaH.palo === 'copa' ? 'card-cup' : cartaH.palo === 'espada' ? 'card-sword' : 'card-club';
            const paloB = cartaB.palo === 'oro' ? 'card-gold' : cartaB.palo === 'copa' ? 'card-cup' : cartaB.palo === 'espada' ? 'card-sword' : 'card-club';

            centerDiv.innerHTML = `
                <div style="text-align:center;"><div style="font-size:0.75rem; color:#38bdf8;">Tú</div><div class="playing-card ${paloH}"><span>${cartaH.num}</span><span style="font-size:1.2rem; align-self:center;">${ICONOS_PALOS[cartaH.palo]}</span><span>${cartaH.num}</span></div></div>
                <div style="text-align:center;"><div style="font-size:0.75rem; color:#f43f5e;">Bot</div><div class="playing-card ${paloB}"><span>${cartaB.num}</span><span style="font-size:1.2rem; align-self:center;">${ICONOS_PALOS[cartaB.palo]}</span><span>${cartaB.num}</span></div></div>
            `;
            logMsg(`Tiraste ${cartaH.num} de ${cartaH.palo} vs Bot tiró ${cartaB.num} de ${cartaB.palo} -> ${ganador}`);

            setTimeout(() => {
                if (trucoManoHumano.length === 0) {
                    alert("¡Mano de Truco terminada!");
                    initTruco();
                } else {
                    renderTruco();
                }
            }, 1800);
        }

        // --- 9. TUTE CABREO ---
        let tutePlayerHand = [];
        let tuteBotHand = [];
        let tuteTriunfo = { num: 12, palo: 'espada' };
        function initTute() {
            let mazo = [];
            ['oro', 'copa', 'espada', 'basto'].forEach(palo => {
                [1, 2, 3, 4, 5, 6, 7, 10, 11, 12].forEach(num => mazo.push({ num, palo }));
            });
            mazo.sort(() => Math.random() - 0.5);
            tutePlayerHand = [mazo.pop(), mazo.pop(), mazo.pop(), mazo.pop()];
            tuteBotHand = [mazo.pop(), mazo.pop(), mazo.pop(), mazo.pop()];
            tuteTriunfo = mazo.pop();
            renderTute();
        }
        function renderTute() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Tute Cabreo | Triunfo: ${ICONOS_PALOS[tuteTriunfo.palo]} (${tuteTriunfo.num})`;
            area.innerHTML = `
                <div class="card-table">
                    <div>
                        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:4px; text-align:center;">Cartas del Bot:</div>
                        <div class="opponent-hand-area" id="tute-bot-hand"></div>
                    </div>
                    <div class="center-board-area"><div style="color:#94a3b8; font-style:italic;">Juega cartas al centro</div></div>
                    <div>
                        <div style="font-size:0.8rem; color:var(--accent-color); margin-bottom:4px; text-align:center;">Tus Cartas:</div>
                        <div class="player-hand" id="tute-player-hand"></div>
                    </div>
                </div>
            `;
            const botDiv = document.getElementById('tute-bot-hand');
            tuteBotHand.forEach(() => {
                const el = document.createElement('div');
                el.className = 'playing-card hidden-card';
                el.innerHTML = `<span style="font-size:0.8rem; align-self:center;">TUTE</span>`;
                botDiv.appendChild(el);
            });
            const playerDiv = document.getElementById('tute-player-hand');
            tutePlayerHand.forEach((card, idx) => {
                const paloClass = card.palo === 'oro' ? 'card-gold' : card.palo === 'copa' ? 'card-cup' : card.palo === 'espada' ? 'card-sword' : 'card-club';
                const el = document.createElement('div');
                el.className = `playing-card ${paloClass}`;
                el.innerHTML = `<span>${card.num}</span><span style="font-size:1.4rem; align-self:center;">${ICONOS_PALOS[card.palo]}</span><span>${card.num}</span>`;
                el.onclick = () => {
                    tutePlayerHand.splice(idx, 1);
                    logMsg(`Jugaste ${card.num} de ${card.palo}`);
                    if (tutePlayerHand.length === 0) { alert("¡Ronda de Tute terminada!"); initTute(); }
                    else renderTute();
                };
                playerDiv.appendChild(el);
            });
        }

        // --- 10. AJEDREZ CLÁSICO ---
        let chessBoard = [], selectedSq = null, chessTurn = 'w';
        function initChess() {
            chessBoard = [
                ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
                ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', ''],
                ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
                ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
            ];
            selectedSq = null; chessTurn = 'w'; renderChess();
        }
        function renderChess() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Ajedrez | Turno de ${chessTurn === 'w' ? 'Blancas' : 'Negras'}`;
            area.innerHTML = `<div class="chess-grid" id="chess-grid"></div>`;
            const grid = document.getElementById('chess-grid');
            const sym = { 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙' };
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `chess-cell ${(r + c) % 2 === 0 ? 'chess-light' : 'chess-dark'}`;
                    let p = chessBoard[r][c];
                    if (p) cell.innerText = sym[p];
                    if (selectedSq && selectedSq.r === r && selectedSq.c === c) cell.classList.add('chess-selected');
                    cell.onclick = () => {
                        if (!selectedSq) {
                            if (p && ((chessTurn === 'w' && p === p.toUpperCase()) || (chessTurn === 'b' && p === p.toLowerCase()))) {
                                selectedSq = { r, c }; renderChess();
                            }
                        } else {
                            if (selectedSq.r === r && selectedSq.c === c) {
                                selectedSq = null; renderChess();
                            } else {
                                chessBoard[r][c] = chessBoard[selectedSq.r][selectedSq.c];
                                chessBoard[selectedSq.r][selectedSq.c] = '';
                                selectedSq = null; chessTurn = chessTurn === 'w' ? 'b' : 'w';
                                renderChess();
                            }
                        }
                    };
                    grid.appendChild(cell);
                }
            }
        }

        // --- 11. GENERALA TÁCTICA ---
        let genRolls = 3, genDice = [1, 2, 3, 4, 5], genHeld = [false, false, false, false, false], genScores = {};
        const GEN_CATS = [
            { key: '1', name: '1 (As)' }, { key: '2', name: '2' }, { key: '3', name: '3' },
            { key: '4', name: '4' }, { key: '5', name: '5' }, { key: '6', name: '6' },
            { key: 'escalera', name: 'Escalera' }, { key: 'full', name: 'Full' },
            { key: 'poker', name: 'Poker' }, { key: 'generala', name: 'Generala' },
            { key: 'doble', name: 'Doble Generala' }
        ];
        function initGenerala() {
            genRolls = 3; genHeld = [false, false, false, false, false]; genDice = [1, 1, 1, 1, 1]; genScores = {};
            GEN_CATS.forEach(c => genScores[c.key] = null);
            renderGeneralaUI();
        }
        function renderGeneralaUI() {
            const area = document.getElementById('game-board-area');
            document.getElementById('game-status').innerText = `Generala | Tiradas restantes: ${genRolls}`;
            area.innerHTML = `
                <div style="display:flex; gap:8px; justify-content:center; margin-bottom:10px;" id="gen-dice"></div>
                <button class="btn btn-green" style="max-width:280px; margin-bottom:10px;" onclick="rollGeneralaDice()">Lanzar Dados (${genRolls})</button>
                <div style="background:var(--panel-bg); border:1px solid var(--border-color); border-radius:8px; padding:8px; width:100%; max-width:420px;">
                    <table style="width:100%; border-collapse:collapse; font-size:0.8rem;" id="gen-table"></table>
                </div>
            `;
            renderGenDiceEl(); renderGenTableEl();
        }
        function renderGenDiceEl() {
            const container = document.getElementById('gen-dice');
            if (!container) return;
            container.innerHTML = '';
            genDice.forEach((val, i) => {
                const die = document.createElement('div');
                die.style.cssText = `width:44px; height:44px; background:${genHeld[i] ? '#059669' : '#1e293b'}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:bold; border-radius:8px; cursor:pointer; border:2px solid ${genHeld[i] ? '#34d399' : '#475569'};`;
                die.innerText = val;
                die.onclick = () => { if (genRolls < 3 && genRolls > 0) { genHeld[i] = !genHeld[i]; renderGenDiceEl(); } };
                container.appendChild(die);
            });
        }
        function rollGeneralaDice() {
            if (genRolls <= 0) return;
            for (let i = 0; i < 5; i++) if (!genHeld[i]) genDice[i] = Math.floor(Math.random() * 6) + 1;
            genRolls--;
            renderGeneralaUI();
        }
        function renderGenTableEl() {
            const table = document.getElementById('gen-table');
            if (!table) return;
            table.innerHTML = `<tr><th style="border:1px solid #1e3a5f; padding:4px;">Categoría</th><th style="border:1px solid #1e3a5f; padding:4px;">Puntaje</th></tr>`;
            GEN_CATS.forEach(cat => {
                let val = genScores[cat.key];
                let row = `<tr><td style="border:1px solid #1e3a5f; padding:4px;"><b>${cat.name}</b></td>`;
                if (val !== null) row += `<td style="border:1px solid #1e3a5f; padding:4px; color:#10b981; font-weight:bold;">${val}</td>`;
                else if (genRolls < 3) row += `<td style="border:1px solid #1e3a5f; padding:4px; color:#38bdf8; cursor:pointer;" onclick="scoreGeneralaCat('${cat.key}')">Anotar</td>`;
                else row += `<td style="border:1px solid #1e3a5f; padding:4px;">-</td>`;
                row += `</tr>`;
                table.innerHTML += row;
            });
        }
        function scoreGeneralaCat(cat) {
            let counts = {}; genDice.forEach(x => counts[x] = (counts[x] || 0) + 1);
            let pts = 0;
            if (['1', '2', '3', '4', '5', '6'].includes(cat)) pts = (counts[parseInt(cat)] || 0) * parseInt(cat);
            else if (cat === 'generala') pts = Object.values(counts).some(v => v === 5) ? 50 : 0;
            genScores[cat] = pts;
            genRolls = 3; genHeld = [false, false, false, false, false];
            renderGeneralaUI();
        }
    </script>
</body>

</html>
