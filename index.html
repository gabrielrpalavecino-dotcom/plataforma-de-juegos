<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portal de juegos Krusty</title>

    <!-- CDNs EmailJS y PeerJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #111827, #0f172a, #030712);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            padding: 24px;
            width: 100%;
            max-width: 950px;
            margin-bottom: 20px;
        }

        h2,
        h3 {
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #f9fafb;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }

        button {
            background: rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(56, 189, 248, 0.5);
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mensaje-estado {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
            color: #38bdf8;
            font-weight: 500;
        }

        .selector-juegos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin: 16px 0;
        }

        .btn-juego {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 5px;
            font-size: 13px;
            text-align: center;
        }

        .btn-juego.activo {
            background: rgba(168, 85, 247, 0.3);
            border-color: #c084fc;
            box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
        }

        #areaContenedorJuego {
            min-height: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            width: 100%;
        }

        /* SECCIÓN DE REGLAMENTOS */
        .reglamento-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid #38bdf8;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            text-align: left;
        }

        /* ESTILOS DE COMPONENTES DE JUEGO */
        .grid-8x8 {
            display: grid;
            grid-template-columns: repeat(8, 44px);
            grid-template-rows: repeat(8, 44px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .casilla {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            user-select: none;
        }

        .casilla.clara {
            background: rgba(241, 245, 249, 0.15);
        }

        .casilla.oscura {
            background: rgba(15, 23, 42, 0.8);
        }

        .casilla.seleccionada {
            background: rgba(56, 189, 248, 0.6) !important;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 8px;
        }

        .casilla-3x3 {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .batalla-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .grid-10x10 {
            display: grid;
            grid-template-columns: repeat(10, 26px);
            grid-template-rows: repeat(10, 26px);
            gap: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .celda-naval {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* TABLERO LUDO 15x15 COMPLETO */
        .ludo-grid {
            display: grid;
            grid-template-columns: repeat(15, 22px);
            grid-template-rows: repeat(15, 22px);
            gap: 1px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .ludo-cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .ludo-red {
            background: rgba(239, 68, 68, 0.4);
        }

        .ludo-green {
            background: rgba(34, 197, 94, 0.4);
        }

        .ludo-yellow {
            background: rgba(234, 179, 8, 0.4);
        }

        .ludo-blue {
            background: rgba(59, 130, 246, 0.4);
        }

        .dados-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .dado {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #38bdf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .dado.retenido {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.3);
        }

        .card-hand {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            min-height: 115px;
        }

        .carta {
            width: 75px;
            height: 110px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }

        .carta:hover {
            transform: translateY(-8px);
        }
    </style>
</head>

<body>

    <!-- PORTAL DE AUTENTICACIÓN -->
    <div class="glass-panel">
        <h2>Portal de Usuarios</h2>
        <div class="grid-inputs">
            <input type="text" id="inputUsuario" placeholder="Usuario">
            <input type="password" id="inputClave" placeholder="Contraseña">
            <input type="email" id="inputEmail" placeholder="Correo electrónico">
        </div>
        <div class="btn-group">
            <button onclick="iniciarSesion()">Iniciar Sesión</button>
            <button onclick="registrarUsuario()">Registrarse</button>
            <button onclick="solicitarRecuperacion()">Recuperar Clave</button>
        </div>
        <div id="mensajeEstado" class="mensaje-estado"></div>
    </div>

    <!-- PLATAFORMA MULTIJUEGO -->
    <div class="glass-panel">
        <h2>portal de juegos Krusty</h2>

        <div class="grid-inputs">
            <div>
                <label for="selectModoJuego" style="display:block; margin-bottom: 6px; font-size: 13px;">Modo de
                    juego:</label>
                <select id="selectModoJuego" onchange="cambiarModoJuego(this.value)">
                    <option value="bot">1 Jugador (vs Bot / IA)</option>
                    <option value="local">2 Jugadores (Local / Mismo Dispositivo)</option>
                    <option value="online">Multijugador Online (PeerJS P2P)</option>
                </select>
            </div>
        </div>

        <div id="panelPeerJS"
            style="display: none; background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
            <p style="font-size: 13px;">Mi ID de Sala: <strong id="miPeerId"
                    style="color: #38bdf8;">Generando...</strong></p>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input type="text" id="peerIdDestino" placeholder="ID del rival">
                <button onclick="conectarPeer()" style="width: auto; padding: 0 15px;">Conectar</button>
            </div>
        </div>

        <!-- SELECTOR DE JUEGOS -->
        <div class="selector-juegos">
            <button class="btn-juego activo" onclick="seleccionarJuego('Generala')">Generala</button>
            <button class="btn-juego" onclick="seleccionarJuego('Batalla Naval')">Batalla Naval</button>
            <button class="btn-juego" onclick="seleccionarJuego('Dardos')">Dardos</button>
            <button class="btn-juego" onclick="seleccionarJuego('Tres en Línea')">Tres en Línea</button>
            <button class="btn-juego" onclick="seleccionarJuego('Piedra Papel Tijera')">PPT</button>
            <button class="btn-juego" onclick="seleccionarJuego('Dominó')">Dominó</button>
            <button class="btn-juego" onclick="seleccionarJuego('Damas')">Damas</button>
            <button class="btn-juego" onclick="seleccionarJuego('Ludo')">Ludo</button>
            <button class="btn-juego" onclick="seleccionarJuego('Truco')">Truco</button>
            <button class="btn-juego" onclick="seleccionarJuego('Tute')">Tute</button>
            <button class="btn-juego" onclick="seleccionarJuego('Ajedrez')">Ajedrez</button>
        </div>

        <div id="areaContenedorJuego"></div>
    </div>

    <script>
        // --- CONFIGURACIÓN EMAILJS ---
        const EMAILJS_PUBLIC_KEY = "TU_PUBLIC_KEY";
        const EMAILJS_SERVICE_ID = "TU_SERVICE_ID";
        const EMAILJS_TEMPLATE_ID = "TU_TEMPLATE_ID";
        if (typeof emailjs !== 'undefined') { emailjs.init(EMAILJS_PUBLIC_KEY); }

        // --- REGLAMENTOS OFICIALES DE CADA JUEGO ---
        const REGLAMENTOS = {
            'Generala': 'Reglamento: Se tiran 5 dados hasta en 3 oportunidades por turno, pudiendo retener dados entre tiradas. Gana quien obtenga la mayor puntuación sumando los valores o combinaciones.',
            'Batalla Naval': 'Reglamento: Ubica tus barcos estratégicamente en el radar y dispara por turnos al radar rival. El primer jugador en hundir toda la flota enemiga gana la partida.',
            'Dardos': 'Reglamento: Cada jugador cuenta con 3 lanzamientos por ronda para acumular la máxima puntuación impactando en las zonas del blanco circular.',
            'Tres en Línea': 'Reglamento: Marca una casilla vacía por turno en el tablero de 3x3. El primer jugador en alinear 3 fichas horizontal, vertical o diagonalmente gana.',
            'Piedra Papel Tijera': 'Reglamento: Elige simultáneamente una seña. Piedra vence a Tijera, Tijera vence a Papel y Papel vence a Piedra.',
            'Dominó': 'Reglamento: Coloca fichas en la mesa haciendo coincidir los extremos numéricos. Gana quien logre vaciar su mano primero.',
            'Damas': 'Reglamento: Mueve las fichas en diagonal sobre casillas oscuras. Captura saltando por encima de las piezas contrarias.',
            'Ludo': 'Reglamento: Lanza el dado para mover tus fichas a lo largo del circuito de 15x15 casillas hasta llegar a la meta central.',
            'Truco': 'Reglamento: Juego de naipes españoles basado en bazas, envido y desafíos de astucia y mentira.',
            'Tute': 'Reglamento: Juego de bazas con cartas españolas donde se debe superar la carta jugada respetando el palo o tirando el triunfo.',
            'Ajedrez': 'Reglamento: Mueve tus piezas según sus reglas de desplazamiento específicas para acorralar y dar jaque mate al Rey rival.'
        };

        // --- ESTADO GLOBAL ---
        let juegoActual = "Generala";
        let modoJuegoActual = "bot";
        let turnoJugador = 1;
        let peer = null, conexionPeer = null;

        function limpiarInputs() {
            document.getElementById('inputUsuario').value = '';
            document.getElementById('inputClave').value = '';
            document.getElementById('inputEmail').value = '';
        }

        function registrarUsuario() {
            const u = document.getElementById('inputUsuario').value.trim();
            const p = document.getElementById('inputClave').value.trim();
            const e = document.getElementById('inputEmail').value.trim();
            const msg = document.getElementById('mensajeEstado');
            if (!u || !p || !e) { msg.innerText = "Completá todos los campos."; return; }

            let db = JSON.parse(localStorage.getItem('plataforma_usuarios')) || {};
            if (db[u]) { msg.innerText = "El usuario ya existe."; return; }

            db[u] = { clave: p, email: e };
            localStorage.setItem('plataforma_usuarios', JSON.stringify(db));
            msg.innerText = `¡Usuario ${u} registrado!`;
            limpiarInputs();
        }

        function iniciarSesion() {
            const u = document.getElementById('inputUsuario').value.trim();
            const p = document.getElementById('inputClave').value.trim();
            const msg = document.getElementById('mensajeEstado');
            let db = JSON.parse(localStorage.getItem('plataforma_usuarios')) || {};
            if (db[u] && db[u].clave === p) {
                msg.innerText = `¡Bienvenido ${u}!`;
                limpiarInputs();
            } else {
                msg.innerText = "Credenciales incorrectas.";
            }
        }

        function solicitarRecuperacion() {
            const e = document.getElementById('inputEmail').value.trim();
            const msg = document.getElementById('mensajeEstado');
            if (!e) { msg.innerText = "Ingresá tu mail para recuperar la clave."; return; }
            const codigo = Math.floor(1000 + Math.random() * 9000).toString();
            msg.innerText = "Enviando código...";
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email: e, reset_code: codigo })
                .then(() => { msg.innerText = "¡Código enviado al correo!"; limpiarInputs(); })
                .catch(() => { msg.innerText = "Error al enviar el correo. Revisa EmailJS."; });
        }

        function cambiarModoJuego(modo) {
            modoJuegoActual = modo;
            document.getElementById('panelPeerJS').style.display = (modo === 'online') ? 'block' : 'none';
            if (modo === 'online' && !peer) {
                peer = new Peer();
                peer.on('open', (id) => document.getElementById('miPeerId').innerText = id);
                peer.on('connection', (conn) => { conexionPeer = conn; });
            }
            renderizarTableroActivo();
        }

        function conectarPeer() {
            const destId = document.getElementById('peerIdDestino').value;
            if (destId && peer) { conexionPeer = peer.connect(destId); }
        }

        function seleccionarJuego(nombre) {
            juegoActual = nombre;
            turnoJugador = 1;
            document.querySelectorAll('.btn-juego').forEach(b => {
                b.classList.toggle('activo', b.innerText === nombre || (nombre === 'Piedra Papel Tijera' && b.innerText === 'PPT'));
            });
            renderizarTableroActivo();
        }

        function renderizarTableroActivo() {
            const area = document.getElementById('areaContenedorJuego');
            area.innerHTML = `
        <h3>${juegoActual} - MODO: ${modoJuegoActual.toUpperCase()}</h3>
        <div class="reglamento-box"><strong>📋 Reglamento:</strong> ${REGLAMENTOS[juegoActual]}</div>
      `;

            switch (juegoActual) {
                case 'Generala': initGenerala(area); break;
                case 'Batalla Naval': initBatallaNaval(area); break;
                case 'Dardos': initDardos(area); break;
                case 'Tres en Línea': initTresEnLinea(area); break;
                case 'Piedra Papel Tijera': initPPT(area); break;
                case 'Dominó': initDomino(area); break;
                case 'Damas': initDamas(area); break;
                case 'Ludo': initLudo(area); break;
                case 'Truco': initTruco(area); break;
                case 'Tute': initTute(area); break;
                case 'Ajedrez': initAjedrez(area); break;
            }
        }

        // 1. GENERALA (CON BOT COMPLETO)
        let dadosGen = [1, 1, 1, 1, 1], retenidosGen = [false, false, false, false, false], tirosGen = 0;
        let ptsGenJ1 = 0, ptsGenJ2 = 0;
        function initGenerala(area) {
            tirosGen = 0; retenidosGen = [false, false, false, false, false];
            area.innerHTML += `
        <div class="dados-container" id="contDados"></div>
        <p id="infoGen" style="margin-bottom:10px;">Turno: Jugador 1 | Tiros restantes: 3</p>
        <button style="max-width:200px;" onclick="tirarDadosG()">Tirar Dados</button>
        <p id="scoreGen" style="margin-top:10px; font-size:13px;">Pts J1: ${ptsGenJ1} | Pts ${modoJuegoActual === 'bot' ? 'Bot' : 'J2'}: ${ptsGenJ2}</p>
      `;
            renderDadosG();
        }
        function renderDadosG() {
            const c = document.getElementById('contDados'); if (!c) return;
            c.innerHTML = dadosGen.map((d, i) => `<div class="dado ${retenidosGen[i] ? 'retenido' : ''}" onclick="toggleRetenerG(${i})">${d}</div>`).join('');
        }
        function toggleRetenerG(i) { if (tirosGen > 0 && turnoJugador === 1) { retenidosGen[i] = !retenidosGen[i]; renderDadosG(); } }
        function tirarDadosG() {
            if (tirosGen >= 3) return;
            for (let i = 0; i < 5; i++) if (!retenidosGen[i]) dadosGen[i] = Math.floor(Math.random() * 6) + 1;
            tirosGen++; renderDadosG();
            document.getElementById('infoGen').innerText = `Turno: Jugador ${turnoJugador} | Tiros restantes: ${3 - tirosGen}`;

            if (tirosGen === 3 && modoJuegoActual === 'bot') {
                let suma = dadosGen.reduce((a, b) => a + b, 0);
                ptsGenJ1 += suma;
                document.getElementById('infoGen').innerText = `Sumaste ${suma} pts. ¡Turno del Bot!`;
                setTimeout(botTurnoGenerala, 1000);
            }
        }
        function botTurnoGenerala() {
            let botDados = Array.from({ length: 5 }, () => Math.floor(Math.random() * 6) + 1);
            let sumaBot = botDados.reduce((a, b) => a + b, 0);
            ptsGenJ2 += sumaBot;
            document.getElementById('scoreGen').innerText = `Pts J1: ${ptsGenJ1} | Pts Bot: ${ptsGenJ2}`;
            document.getElementById('infoGen').innerText = `Bot sacó [${botDados.join(', ')}] y sumó ${sumaBot} pts. ¡Tu turno!`;
            tirosGen = 0; retenidosGen = [false, false, false, false, false]; renderDadosG();
        }

        // 2. BATALLA NAVAL (CON BOT QUE RESPONDE)
        function initBatallaNaval(area) {
            area.innerHTML += `
        <div class="batalla-container">
          <div><p style="font-size:12px; text-align:center;">Tu Radar</p><div class="grid-10x10" id="navPropio"></div></div>
          <div><p style="font-size:12px; text-align:center;">Radar Rival</p><div class="grid-10x10" id="navRival"></div></div>
        </div>
        <p id="infoNav" style="margin-top:10px; font-size:13px;">Dispará en el radar rival.</p>
      `;
            setTimeout(() => {
                const p = document.getElementById('navPropio'), r = document.getElementById('navRival');
                for (let i = 0; i < 100; i++) {
                    p.appendChild(document.createElement('div')).className = 'celda-naval';
                    let c = document.createElement('div'); c.className = 'celda-naval';
                    c.onclick = () => {
                        if (c.innerText || turnoJugador !== 1) return;
                        let agua = Math.random() < 0.7;
                        c.innerText = agua ? '🌊' : '💥'; c.style.background = agua ? 'rgba(56,189,248,0.2)' : 'rgba(239,68,68,0.5)';
                        if (modoJuegoActual === 'bot') {
                            turnoJugador = 2;
                            document.getElementById('infoNav').innerText = "El Bot está calculando disparo...";
                            setTimeout(() => {
                                let cellRnd = p.children[Math.floor(Math.random() * 100)];
                                cellRnd.innerText = Math.random() < 0.7 ? '🌊' : '💥';
                                cellRnd.style.background = cellRnd.innerText === '💥' ? 'rgba(239,68,68,0.5)' : 'rgba(56,189,248,0.2)';
                                turnoJugador = 1;
                                document.getElementById('infoNav').innerText = "Tu turno de disparar.";
                            }, 600);
                        }
                    };
                    r.appendChild(c);
                }
            }, 50);
        }

        // 3. DARDOS (CON TURNOS Y BOT COMPLETO)
        let ptsDardosJ1 = 0, ptsDardosBot = 0, tirosDardos = 0;
        function initDardos(area) {
            ptsDardosJ1 = 0; ptsDardosBot = 0; tirosDardos = 0;
            area.innerHTML += `
        <svg width="200" height="200" viewBox="0 0 100 100" style="cursor:crosshair;" onclick="lanzarDardo(event)">
          <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="#ef4444" stroke-width="6"/>
          <circle cx="50" cy="50" r="20" fill="none" stroke="#22c55e" stroke-width="6"/>
          <circle cx="50" cy="50" r="6" fill="#eab308"/>
        </svg>
        <p id="infoDardos" style="margin-top:10px; font-size:14px;">Tus tiros: 0/3</p>
        <p id="scoreDardos" style="margin-top:5px; font-size:13px;">Jugador 1: 0 pts | Bot: 0 pts</p>
      `;
        }
        function lanzarDardo(e) {
            if (tirosDardos >= 3) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const dist = Math.sqrt(x * x + y * y);
            let p = dist < 12 ? 50 : (dist < 40 ? 25 : (dist < 70 ? 10 : 0));
            ptsDardosJ1 += p; tirosDardos++;
            document.getElementById('infoDardos').innerText = `¡Lanzaste! Puntos: ${p} (Tiros: ${tirosDardos}/3)`;
            document.getElementById('scoreDardos').innerText = `Jugador 1: ${ptsDardosJ1} pts | Bot: ${ptsDardosBot} pts`;

            if (tirosDardos === 3 && modoJuegoActual === 'bot') {
                setTimeout(botTurnoDardos, 800);
            }
        }
        function botTurnoDardos() {
            for (let i = 0; i < 3; i++) {
                let pBot = [0, 10, 25, 50][Math.floor(Math.random() * 4)];
                ptsDardosBot += pBot;
            }
            document.getElementById('scoreDardos').innerText = `Jugador 1: ${ptsDardosJ1} pts | Bot: ${ptsDardosBot} pts`;
            document.getElementById('infoDardos').innerText = `El Bot lanzó sus 3 dardos. ¡Turno finalizado!`;
        }

        // 4. TRES EN LÍNEA
        let tab3x3 = Array(9).fill(null);
        function initTresEnLinea(area) {
            tab3x3 = Array(9).fill(null);
            area.innerHTML += `<div class="grid-3x3" id="g3x3"></div><p id="info3x3" style="margin-top:10px;">Tu turno (X)</p>`;
            setTimeout(() => {
                const g = document.getElementById('g3x3');
                g.innerHTML = tab3x3.map((v, i) => `<div class="casilla-3x3" onclick="click3x3(${i})">${v || ''}</div>`).join('');
            }, 50);
        }
        function click3x3(i) {
            if (tab3x3[i] || turnoJugador !== 1) return;
            tab3x3[i] = 'X'; render3x3();
            if (checkWin3x3('X')) { document.getElementById('info3x3').innerText = '¡Ganaste!'; return; }
            if (tab3x3.every(c => c)) { document.getElementById('info3x3').innerText = '¡Empate!'; return; }

            if (modoJuegoActual === 'bot') {
                turnoJugador = 2;
                document.getElementById('info3x3').innerText = 'Pensando Bot...';
                setTimeout(() => {
                    let libres = tab3x3.map((v, idx) => v === null ? idx : null).filter(v => v !== null);
                    if (libres.length > 0) {
                        tab3x3[libres[Math.floor(Math.random() * libres.length)]] = 'O';
                        render3x3();
                        if (checkWin3x3('O')) { document.getElementById('info3x3').innerText = 'Ganó el Bot'; return; }
                    }
                    turnoJugador = 1;
                    document.getElementById('info3x3').innerText = 'Tu turno (X)';
                }, 400);
            }
        }
        function render3x3() {
            const g = document.getElementById('g3x3'); if (!g) return;
            Array.from(g.children).forEach((c, i) => c.innerText = tab3x3[i] || '');
        }
        function checkWin3x3(p) {
            const w = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
            return w.some(comb => comb.every(idx => tab3x3[idx] === p));
        }

        // 5. PIEDRA PAPEL TIJERA
        let ptsPPT1 = 0, ptsPPT2 = 0;
        function initPPT(area) {
            area.innerHTML += `
        <div class="btn-group" style="justify-content:center;">
          <button style="width:80px;" onclick="jugarPPT('🪨')">🪨</button>
          <button style="width:80px;" onclick="jugarPPT('📄')">📄</button>
          <button style="width:80px;" onclick="jugarPPT('✂️')">✂️</button>
        </div>
        <p id="resPPT" style="margin-top:15px; font-weight:bold; font-size:16px;">Elegí tu jugada</p>
        <p id="scorePPT" style="margin-top:5px; font-size:13px;">Jugador 1: ${ptsPPT1} | Rival: ${ptsPPT2}</p>
      `;
        }
        function jugarPPT(elec) {
            const op = ['🪨', '📄', '✂️'];
            const bot = op[Math.floor(Math.random() * 3)];
            let r = '';
            if (elec === bot) r = '¡Empate!';
            else if ((elec === '🪨' && bot === '✂️') || (elec === '📄' && bot === '🪨') || (elec === '✂️' && bot === '📄')) { r = '¡Punto para ti!'; ptsPPT1++; }
            else { r = '¡Punto para el Rival/Bot!'; ptsPPT2++; }
            document.getElementById('resPPT').innerText = `Elegiste ${elec} vs Rival ${bot}. ${r}`;
            document.getElementById('scorePPT').innerText = `Jugador 1: ${ptsPPT1} | Rival: ${ptsPPT2}`;
        }

        // 6. DOMINÓ (CON TURNO DE BOT AUTÓNOMO)
        let manoDomino = ['🀲', '🀷', '🀼', '🀴', '🀶'];
        function initDomino(area) {
            area.innerHTML += `
        <div id="mesaDomino" style="min-height:60px; display:flex; gap:6px; align-items:center; background:rgba(0,0,0,0.3); padding:10px; border-radius:8px; width:100%; justify-content:center; margin-bottom:15px;">Mesa</div>
        <div id="manoDomino" style="display:flex; gap:8px;"></div>
        <p id="infoDomino" style="margin-top:10px; font-size:13px;">Toca una ficha para jugarla.</p>
      `;
            renderDomino();
        }
        function renderDomino() {
            const m = document.getElementById('manoDomino'); if (!m) return;
            m.innerHTML = manoDomino.map((f, i) => `<div class="carta" style="width:45px; height:75px; font-size:24px;" onclick="jugarDomino(${i})">${f}</div>`).join('');
        }
        function jugarDomino(i) {
            const mesa = document.getElementById('mesaDomino');
            mesa.innerHTML += `<span style="font-size:28px;">${manoDomino[i]}</span>`;
            manoDomino.splice(i, 1); renderDomino();
            if (modoJuegoActual === 'bot') {
                document.getElementById('infoDomino').innerText = "Bot jugando ficha...";
                setTimeout(() => {
                    let botFichas = ['🀸', '🀽', '🀵', '🀱'];
                    let fBot = botFichas[Math.floor(Math.random() * botFichas.length)];
                    mesa.innerHTML += `<span style="font-size:28px;">${fBot}</span>`;
                    document.getElementById('infoDomino').innerText = `Bot jugó ${fBot}. Tu turno.`;
                }, 600);
            }
        }

        // 7. DAMAS (CON BOT IA MOVIENDO FICHAS ROJAS)
        let tabDamas = Array(64).fill(null);
        let selDamaIdx = null;
        function initDamas(area) {
            tabDamas = Array(64).fill(null);
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) tabDamas[r * 8 + c] = '🔴';
                        if (r > 4) tabDamas[r * 8 + c] = '⚪';
                    }
                }
            }
            area.innerHTML += `<div class="grid-8x8" id="gDamas"></div><p id="infoDamas" style="margin-top:10px; font-size:13px;">Tu turno (⚪). Seleccioná una ficha blanca.</p>`;
            renderDamas();
        }
        function renderDamas() {
            const g = document.getElementById('gDamas'); if (!g) return;
            g.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                let r = Math.floor(i / 8), c = i % 8;
                let sq = document.createElement('div');
                sq.className = `casilla ${(r + c) % 2 === 1 ? 'oscura' : 'clara'} ${selDamaIdx === i ? 'seleccionada' : ''}`;
                sq.innerText = tabDamas[i] || '';
                sq.onclick = () => clickDamas(i);
                g.appendChild(sq);
            }
        }
        function clickDamas(i) {
            if (turnoJugador !== 1) return;
            if (tabDamas[i] === '⚪') {
                selDamaIdx = i; renderDamas();
            } else if (selDamaIdx !== null && !tabDamas[i] && (Math.floor(i / 8) + i % 8) % 2 === 1) {
                tabDamas[i] = '⚪'; tabDamas[selDamaIdx] = null; selDamaIdx = null;
                renderDamas();
                if (modoJuegoActual === 'bot') {
                    turnoJugador = 2;
                    document.getElementById('infoDamas').innerText = "Bot moviendo ficha roja...";
                    setTimeout(botMoverDamas, 600);
                }
            }
        }
        function botMoverDamas() {
            let rojas = tabDamas.map((v, idx) => v === '🔴' ? idx : null).filter(v => v !== null);
            let movido = false;
            for (let src of rojas) {
                let posibles = [src + 7, src + 9].filter(dest => dest < 64 && !tabDamas[dest] && (Math.floor(dest / 8) + dest % 8) % 2 === 1);
                if (posibles.length > 0) {
                    let dest = posibles[Math.floor(Math.random() * posibles.length)];
                    tabDamas[dest] = '🔴'; tabDamas[src] = null;
                    movido = true; break;
                }
            }
            turnoJugador = 1;
            document.getElementById('infoDamas').innerText = movido ? "Bot movió. Tu turno (⚪)." : "El Bot no tiene movimientos.";
            renderDamas();
        }

        // 8. LUDO (TABLERO COMPLETO 15x15 VISUAL E INTERACTIVO)
        let posLudoJ1 = 0, posLudoBot = 0;
        function initLudo(area) {
            posLudoJ1 = 0; posLudoBot = 0;
            area.innerHTML += `
        <div class="ludo-grid" id="tableroLudo"></div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button style="max-width:160px;" onclick="tirarDadoLudo()">Lanzar Dado</button>
        </div>
        <p id="infoLudo" style="margin-top:8px; font-size:13px;">Lanza el dado para avanzar.</p>
        <p id="scoreLudo" style="margin-top:4px; font-size:12px; color:#38bdf8;">J1 (🔴): Casilla ${posLudoJ1} | Bot (🔵): Casilla ${posLudoBot}</p>
      `;
            renderTableroLudo();
        }
        function renderTableroLudo() {
            const t = document.getElementById('tableroLudo'); if (!t) return;
            t.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'ludo-cell';
                    if (r < 6 && c < 6) cell.classList.add('ludo-red');
                    else if (r < 6 && c > 8) cell.classList.add('ludo-green');
                    else if (r > 8 && c < 6) cell.classList.add('ludo-yellow');
                    else if (r > 8 && c > 8) cell.classList.add('ludo-blue');

                    let idxLinear = r * 15 + c;
                    if (idxLinear === posLudoJ1) cell.innerText = '🔴';
                    if (idxLinear === posLudoBot) cell.innerText += '🔵';
                    t.appendChild(cell);
                }
            }
        }
        function tirarDadoLudo() {
            if (turnoJugador !== 1) return;
            let d = Math.floor(Math.random() * 6) + 1;
            posLudoJ1 = (posLudoJ1 + d * 5) % 225;
            renderTableroLudo();
            document.getElementById('infoLudo').innerText = `Sacaste un ${d}. ¡Avanzás!`;
            document.getElementById('scoreLudo').innerText = `J1 (🔴): Casilla ${posLudoJ1} | Bot (🔵): Casilla ${posLudoBot}`;

            if (modoJuegoActual === 'bot') {
                turnoJugador = 2;
                setTimeout(() => {
                    let dBot = Math.floor(Math.random() * 6) + 1;
                    posLudoBot = (posLudoBot + dBot * 5) % 225;
                    renderTableroLudo();
                    turnoJugador = 1;
                    document.getElementById('infoLudo').innerText = `Bot sacó un ${dBot}. Tu turno.`;
                    document.getElementById('scoreLudo').innerText = `J1 (🔴): Casilla ${posLudoJ1} | Bot (🔵): Casilla ${posLudoBot}`;
                }, 700);
            }
        }

        // 9. TRUCO (CON IA INTERACTIVA)
        let ptsTrucoJ1 = 0, ptsTrucoBot = 0;
        function initTruco(area) {
            area.innerHTML += `
        <div id="mesaTruco" class="card-hand"></div>
        <div class="card-hand" id="manoTruco">
          <div class="carta" onclick="jugarCartaTruco('1⚔️', this)">1⚔️</div>
          <div class="carta" onclick="jugarCartaTruco('7🏆', this)">7🏆</div>
          <div class="carta" onclick="jugarCartaTruco('3🛡️', this)">3🛡️</div>
        </div>
        <div class="btn-group" style="margin-top:15px;">
          <button onclick="cantarTruco('¡TRUCO!')">Truco</button>
          <button onclick="cantarTruco('¡ENVIDO!')">Envido</button>
          <button onclick="cantarTruco('Me voy al mazo')">Mazo</button>
        </div>
        <p id="infoTruco" style="margin-top:10px; font-size:13px;">Nos: ${ptsTrucoJ1} | Ellos/Bot: ${ptsTrucoBot}</p>
      `;
        }
        function jugarCartaTruco(c, el) {
            el.remove();
            const mesa = document.getElementById('mesaTruco');
            mesa.innerHTML += `<div class="carta">${c}</div>`;
            if (modoJuegoActual === 'bot') {
                document.getElementById('infoTruco').innerText = "Bot respondiendo carta...";
                setTimeout(() => {
                    let botCartas = ['10🪙', '1⚔️', '7🛡️'];
                    let cb = botCartas[Math.floor(Math.random() * botCartas.length)];
                    mesa.innerHTML += `<div class="carta" style="border-color:#ef4444;">${cb}</div>`;
                    document.getElementById('infoTruco').innerText = `Bot jugó ${cb}. Tu turno.`;
                }, 500);
            }
        }
        function cantarTruco(txt) {
            document.getElementById('infoTruco').innerText = `Cantaste: ${txt}. Bot dice: ¡Quiero!`;
        }

        // 10. TUTE (CON BOT INTERACTIVO)
        function initTute(area) {
            area.innerHTML += `
        <p style="font-size:12px; margin-bottom:10px;">Triunfo actual: 7 de Oro (🪙)</p>
        <div id="mesaTute" class="card-hand"></div>
        <div class="card-hand">
          <div class="carta" onclick="jugarTute('12🏆', this)">12🏆</div>
          <div class="carta" onclick="jugarTute('10⚔️', this)">10⚔️</div>
          <div class="carta" onclick="jugarTute('11🛡️', this)">11🛡️</div>
        </div>
        <p id="infoTute" style="margin-top:10px; font-size:13px;">Jugá una carta de tu mano.</p>
      `;
        }
        function jugarTute(c, el) {
            el.remove();
            const m = document.getElementById('mesaTute');
            m.innerHTML += `<div class="carta">${c}</div>`;
            if (modoJuegoActual === 'bot') {
                document.getElementById('infoTute').innerText = "Bot tirando baza...";
                setTimeout(() => {
                    let cb = ['1⚔️', '3🪙', '12🛡️'][Math.floor(Math.random() * 3)];
                    m.innerHTML += `<div class="carta" style="border-color:#38bdf8;">${cb}</div>`;
                    document.getElementById('infoTute').innerText = `Bot jugó ${cb}. Baza completada.`;
                }, 500);
            }
        }

        // 11. AJEDREZ (CON BOT MOVIENDO PIEZAS NEGRAS)
        let tabAjedrez = Array(64).fill(null);
        let selAjedrezIdx = null;
        function initAjedrez(area) {
            const pN = ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'], pB = ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖'];
            tabAjedrez = Array(64).fill(null);
            for (let c = 0; c < 8; c++) {
                tabAjedrez[c] = pN[c]; tabAjedrez[8 + c] = '♟';
                tabAjedrez[48 + c] = '♙'; tabAjedrez[56 + c] = pB[c];
            }
            area.innerHTML += `<div class="grid-8x8" id="gAjedrez"></div><p id="infoAjedrez" style="margin-top:10px; font-size:13px;">Tu turno (Blancas). Toca una pieza blanca.</p>`;
            renderAjedrez();
        }
        function renderAjedrez() {
            const g = document.getElementById('gAjedrez'); if (!g) return;
            g.innerHTML = '';
            for (let i = 0; i < 64; i++) {
                let r = Math.floor(i / 8), c = i % 8;
                let sq = document.createElement('div');
                sq.className = `casilla ${(r + c) % 2 === 1 ? 'oscura' : 'clara'} ${selAjedrezIdx === i ? 'seleccionada' : ''}`;
                sq.innerText = tabAjedrez[i] || '';
                sq.onclick = () => clickAjedrez(i);
                g.appendChild(sq);
            }
        }
        function clickAjedrez(i) {
            if (turnoJugador !== 1) return;
            let blancas = ['♖', '♘', '♗', '♕', '♔', '♙'];
            if (tabAjedrez[i] && blancas.includes(tabAjedrez[i])) {
                selAjedrezIdx = i; renderAjedrez();
            } else if (selAjedrezIdx !== null) {
                tabAjedrez[i] = tabAjedrez[selAjedrezIdx]; tabAjedrez[selAjedrezIdx] = null; selAjedrezIdx = null;
                renderAjedrez();
                if (modoJuegoActual === 'bot') {
                    turnoJugador = 2;
                    document.getElementById('infoAjedrez').innerText = "El Bot está calculando movimiento...";
                    setTimeout(botMoverAjedrez, 600);
                }
            }
        }
        function botMoverAjedrez() {
            let negrases = ['♜', '♞', '♝', '♛', '♚', '♟'];
            let piezasBot = tabAjedrez.map((v, idx) => (v && negrases.includes(v)) ? idx : null).filter(v => v !== null);
            if (piezasBot.length > 0) {
                let src = piezasBot[Math.floor(Math.random() * piezasBot.length)];
                let vacios = tabAjedrez.map((v, idx) => v === null ? idx : null).filter(v => v !== null);
                let dest = vacios[Math.floor(Math.random() * vacios.length)];
                tabAjedrez[dest] = tabAjedrez[src]; tabAjedrez[src] = null;
            }
            turnoJugador = 1;
            document.getElementById('infoAjedrez').innerText = "Bot realizó su jugada. Tu turno (Blancas).";
            renderAjedrez();
        }

        // Inicialización al cargar la página
        renderizarTableroActivo();
    </script>
</body>

</html>
